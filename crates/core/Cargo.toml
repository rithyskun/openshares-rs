[package]
name = "openshares-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
sha1.workspace = true
rand.workspace = true
base64.workspace = true
anyhow.workspace = true

# crypto module (phase 6)
sha2.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
rsa.workspace = true
scrypt.workspace = true
jsonwebtoken.workspace = true
subtle.workspace = true
zeroize.workspace = true
# `replication`/`sync` (embedded replicas, grpc/tonic) aren't used —
# dropping them keeps tonic, axum-0.6, h2-0.3 and bincode out of the tree.
libsql = { version = "0.10.0", default-features = false, features = [
    "core",
    "remote",
    "tls",
    "serde",
] }

[dev-dependencies]
tempfile.workspace = true
