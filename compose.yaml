# Local deploy-test stack. `docker compose up -d` runs the API server;
# `docker compose --profile bot up -d` adds the long-poll bot (needs BOT_TOKEN).
services:
  server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - openshares-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      # Compose-level defaults; real values come from .env when present.
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite://data/openshares.db}
      TURSO_DB_URL: ${TURSO_DB_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      MEDIA_CACHE_BACKEND: ${MEDIA_CACHE_BACKEND:-fs}
      MEDIA_CACHE_DIR: ${MEDIA_CACHE_DIR:-./data/cache}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped

  bot:
    build: .
    command: ["openshares-bot"]
    profiles: ["bot"]
    volumes:
      - openshares-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite://data/openshares.db}
      TURSO_DB_URL: ${TURSO_DB_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      MEDIA_CACHE_BACKEND: ${MEDIA_CACHE_BACKEND:-fs}
      MEDIA_CACHE_DIR: ${MEDIA_CACHE_DIR:-./data/cache}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-info}
      BOT_TOKEN: ${BOT_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - server

  # Cloudflare Tunnel — outbound-only HTTPS ingress, no inbound ports.
  # `docker compose --profile tunnel up -d`. TUNNEL_TOKEN comes from the
  # Zero Trust dashboard; route the hostname to `http://server:8080`.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - server

volumes:
  openshares-data:
